  /api/programs:
    get:
      summary: Programs
      description: '사업 목록. 게스트에게 화면 3 에서 사업을 묻기 위한 재료 (§10 확인필요 #1).


        룰 조회 키가 `사업 × 비목` 이라 사업을 모르면 한도를 못 고른다 — 그래서

        게스트에게도 물어야 한다. 그 UI 결정의 데이터는 여기가 준다.'
      operationId: programs_api_programs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Programs Api Programs Get
  /api/normalize:
    post:
      summary: Normalize
      description: '화면 3 → 4. SSE.


        이벤트 순서: `진행`* → `결과`(전체 JSON) → `완료`

        프론트가 단순하게 가고 싶으면 `결과` 하나만 들어도 된다.'
      operationId: normalize_api_normalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server__models_________2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/judge:
    post:
      summary: Judge
      description: "화면 4 → 5 / 6 / 7. SSE.\n\n이벤트 순서: `진행`* → `판정` → `해야할일` → `인용` → `전제` → `참조사슬`\n \
        \           → `결과`(전체 JSON) → `저장`(계획 연결 결과) → `완료`\n\n목 모드에서 `?목=조건부|불가|판단불가` 로 4-way 를 전부 그려볼\
        \ 수 있다.\n\U0001F534 판단불가는 에러가 아니라 정상 경로다 — 빨간 화면이 아니라 화면 9 로 잇는다.\n\U0001F534 `저장` 은 부수 효과다 —\
        \ `plan_id` 가 없거나 캐시 적중이거나 저장이 실패해도\n   스트림은 항상 `완료` 까지 간다 (`_판정_저장_시도` 참조).\n\U0001F534 실 판정\
        \ 대기 중에는 `SUDDOE_JUDGE_HEARTBEAT_SEC`(기본 12초) 마다 SSE 주석\n   (`: keep-alive`)이 낀다 — EventSource\
        \ 가 무시하는 라인이라 이벤트 목록·순서에는\n   안 잡힌다. 프록시·게이트웨이의 idle timeout 으로 스트림이 끊기는 걸 막는다."
      operationId: judge_api_judge_post
      parameters:
      - name: 목
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: 목
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server__models________4'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/profile:
    get:
      summary: Profile Get
      description: 게스트도 판정은 된다 — 프로필이 없으면 빈 값을 돌려주고 전제[] 가 늘어날 뿐이다.
      operationId: profile_get_api_profile_get
