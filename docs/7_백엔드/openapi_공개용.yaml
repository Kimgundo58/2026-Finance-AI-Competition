      description: '🔴 재판정 규칙 — 여기가 제일 틀리기 쉽다.


        ① 출처=''user'' 행은 **절대** 건드리지 않는다

        ② 날짜_사용자수정=true 인 행의 due_date 는 덮지 않는다

        ③ 같은 `코드` 의 ai 행은 갱신, 없어진 것은 지운다

        ④ 코드가 없으면(코드=NULL) 항목 텍스트로 대조한다'
