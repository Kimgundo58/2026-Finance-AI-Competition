  /api/tasks:
    get:
      tags:
      - 할일
      summary: 목록
      operationId: 목록_api_tasks_get
      parameters:
      - name: 상태
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 준비필요·집행예정·완료
          title: 상태
        description: 준비필요·집행예정·완료
      - name: 구분
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 결제전·결제후·집행
          title: 구분
        description: 결제전·결제후·집행
      - name: plan_id
        in: query
        required: false
