          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server__models__________1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 지출계획
      summary: 생성
      operationId: 생성_api_plans_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server__models________1'
      responses:
