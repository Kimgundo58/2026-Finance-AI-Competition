# PR 과 main push 마다 도는 검사. LLM·외부 키는 쓰지 않는다. 절차: docs/8_운영/8-8_CI_CD.md
# checks = DB 없음, ontology-db = 레포만으로 만든 Postgres 에 온톨로지 적재 · 능력 질문 · 개정 처리.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: 의존성 설치 (API 컨테이너와 같은 requirements-api.txt)
        run: pip install -r requirements-api.txt

      - name: 문법 검사
        run: python -m compileall -q server scripts

      - name: 서버 self-test (SUDDOE_MOCK=1, DB·LLM 없음)
        env:
          SUDDOE_MOCK: "1"
        run: python -m server.selftest

      - name: rule_lookup self-test (DB 없음)
        run: python scripts/rule_lookup_check.py --self-test

      - name: 확인 질문 self-test (DB·LLM 없음)
        run: python scripts/question_check.py --self-test

      - name: 자금 구분 self-test (DB·LLM 없음)
        run: python scripts/ontology_fund.py --self-test

      - name: 코드 게이트 self-test (DB·LLM 없음)
        run: python scripts/ontology_gate.py --self-test

      - name: 판정 문맥 self-test (DB·LLM 없음)
        run: python scripts/ontology_context.py --self-test

      - name: 조사·근거·AGE 질의 회귀 (합성 자료, DB·외부 호출 없음)
        run: |
          set -euo pipefail
          for check in \
            scripts/ontology_query_check.py \
            scripts/ontology_query_plan_check.py \
            scripts/ontology_research_check.py \
            scripts/ontology_evidence_check.py \
            scripts/ontology_table_evidence_check.py \
            scripts/ontology_final_research_check.py \
            scripts/ontology_no_fallback_check.py \
            scripts/agentic_loop_check.py \
            scripts/web_research_check.py \
            server/research_sessions_check.py; do
            python -I -X utf8 -c "import runpy,sys; sys.path[:0]=['.','scripts']; runpy.run_path(sys.argv[1],run_name='__main__')" "$check"
          done

      - name: DB·첨부·L3 백업 합성 검사
        run: bash deploy/ncp/backup_check.sh

      # 온톨로지 원천 검사는 HermiT(Java)를 쓴다. Java · owlready2 는 CI 잡에만 있고 API 이미지에는 넣지 않는다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: owlready2 설치 (requirements-api.txt 에 넣지 않는다)
        run: pip install owlready2==0.51

      - name: 온톨로지 검사 self-test (DB·LLM 없음)
        run: python scripts/ontology_check.py --self-test

      - name: 추출 비교 self-test (DB·LLM 없음)
        run: python scripts/extraction_compare.py --self-test

      - name: 확정표 → 원천 JSON 변환 self-test (DB·LLM 없음)
        run: python scripts/extraction_to_json.py --self-test

      - name: 추출 실행기록 self-test (DB·LLM 없음)
        run: python scripts/extraction_run.py --self-test

      - name: 용어 풀이 self-test (DB·LLM 없음)
        run: python scripts/ontology_terms.py --self-test

  ontology-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PGCLIENTENCODING: UTF8
      HF_HUB_OFFLINE: "1"
      # db/init 의 로컬 전용 비밀번호다. 이 잡의 서비스 컨테이너 밖에서는 쓰지 않는다.
      OWNER_DSN: postgresql://postgres:devpw@127.0.0.1:5432/suddoe_ci
      SUDDOE_DSN: postgresql://suddoe_app:devpw@127.0.0.1:5432/suddoe_ci
      SUDDOE_INGEST_DSN: postgresql://suddoe_ingest:devpw@127.0.0.1:5432/suddoe_ci
    steps:
      - uses: actions/checkout@v4

      # 서비스 컨테이너는 steps 전에 생성되므로, PR의 Dockerfile을 먼저 빌드하고
      # 이 잡 전용의 빈 컨테이너를 띄운다. 기존 서비스 볼륨은 사용하지 않는다.
      - name: PostgreSQL 17 + pgvector + AGE 이미지 빌드
        run: docker build -f db/Dockerfile.age -t suddoe-ci-age:local db

      - name: 빈 DB 시작
        run: |
          docker run -d --name suddoe-ci-age-db \
            -e POSTGRES_PASSWORD=devpw -e POSTGRES_DB=suddoe_ci \
            -e POSTGRES_INITDB_ARGS=--locale=C.UTF-8 \
            -p 127.0.0.1:5432:5432 suddoe-ci-age:local
          for _ in $(seq 1 90); do
            if docker exec suddoe-ci-age-db pg_isready -h 127.0.0.1 -U postgres -d suddoe_ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'DB readiness timeout' >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 의존성 설치 (requirements-api.txt + owlready2)
        run: pip install -r requirements-api.txt owlready2==0.51

      - name: 스키마 만들기 (db/init)
        run: |
          for f in db/init/*.sql; do
            psql "$OWNER_DSN" -X -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done

      - name: AGE 확장과 그래프 적용
        run: psql "$OWNER_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/migrations/2026-11-09_온톨로지_AGE.sql

      - name: 제한된 앱 롤 AGE 조회 및 pgvector 확인
        run: |
          psql "$SUDDOE_DSN" -X -v ON_ERROR_STOP=1 <<'SQL'
          LOAD '$libdir/plugins/age';
          SET search_path = ag_catalog, corpus, extensions, public;
          SET jit = on;
          SET jit_above_cost = 0;
          SET jit_inline_above_cost = 0;
          SELECT * FROM cypher('suddoe_ontology', $$ MATCH (v) RETURN count(v) $$) AS (total agtype);
          DO $$ BEGIN
            IF '[1,2]'::extensions.vector <-> '[1,2]'::extensions.vector <> 0 THEN
              RAISE EXCEPTION 'pgvector distance mismatch';
            END IF;
          END $$;
          SQL

      - name: 조문 넣기 (ontology/테스트/CI_원문.json)
        run: python scripts/ontology_ci_seed.py

      - name: 적재 검사와 적재 (코드 검사 + HermiT + DB 대조)
        run: python scripts/ontology_load.py

      - name: 능력 질문 테스트
        run: python scripts/ontology_lookup.py --cq-test ontology/테스트/능력질문.json

      - name: 조회 self-test
        run: python scripts/ontology_lookup.py --self-test

      - name: 판정 경로 시험 (판정 LLM 출력 고정, 화면 경로)
        run: python scripts/ontology_judge_check.py --self-test

      - name: AGE 동등성 및 권한 회귀
        env:
          AGE_TEST_APP_DSN: postgresql://suddoe_app:devpw@127.0.0.1:5432/suddoe_ci
          AGE_TEST_INGEST_DSN: postgresql://suddoe_ingest:devpw@127.0.0.1:5432/suddoe_ci
        run: python -I -X utf8 scripts/ontology_age_check.py --버리는-DB

      - name: AGE API 캐시 및 장애 회귀
        run: python scripts/ontology_age_api_check.py --버리는-DB --dsn "$SUDDOE_DSN"

      # 문서를 실제로 활성화한다. DB 를 바꾸므로 마지막에 둔다.
      - name: 개정 처리 점검
        run: python scripts/ontology_revision_check.py --버리는-DB
